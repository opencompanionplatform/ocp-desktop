name: Build public OCP Desktop unsigned release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix, for example 0.1.0-rc.1
        required: true
        type: string
      arch:
        description: Windows target architecture
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x86_64

permissions:
  contents: read

concurrency:
  group: public-desktop-build-${{ github.ref }}-${{ inputs.arch || 'tag' }}
  cancel-in-progress: false

jobs:
  build-windows-portable:
    name: Unsigned Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'push' && '["arm64","x86_64"]' || format('["{0}"]', inputs.arch)) }}
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      OCP_RELEASE_STORE_ORIGIN: https://ocp-store-dp4.pages.dev
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify public-source provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $info = Get-Content PUBLIC-SOURCE-INFO.json -Raw | ConvertFrom-Json
          if ($info.schema -ne 'ocp-public-desktop-source/1') { throw 'Unexpected public-source schema.' }
          if ($info.publicRepository -ne 'opencompanionplatform/ocp-desktop') { throw 'Unexpected public repository identity.' }
          if ($info.sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid private source provenance SHA.' }
          Write-Host "sourceCommit=$($info.sourceCommit) publicCommit=$env:GITHUB_SHA"

      - name: Resolve release version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'push') {
            if ($env:TAG_NAME -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
              throw "Release tag is invalid: $env:TAG_NAME"
            }
            $version = $env:TAG_NAME.Substring(1)
          } else {
            $version = $env:INPUT_VERSION
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release version is invalid: $version"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "release_version=$version store_origin=$env:OCP_RELEASE_STORE_ORIGIN"

      - name: Cheap release preflight
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File release/Test-OcpWindowsReleasePreflight.ps1 `
            -Version $env:RELEASE_VERSION `
            -Arch $env:TARGET_ARCH

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: |
            apps/desktop-shell/package-lock.json
            apps/animation-studio/app/package-lock.json

      - name: Download pinned official Godot editors
        shell: pwsh
        env:
          GODOT_VERSION: 4.7.1-stable
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION"
          $buildArchive = 'Godot_v4.7.1-stable_win64.exe.zip'
          $runtimeArchive = if ($env:TARGET_ARCH -eq 'arm64') {
            'Godot_v4.7.1-stable_windows_arm64.exe.zip'
          } else {
            $buildArchive
          }
          Invoke-WebRequest "$base/SHA512-SUMS.txt" -OutFile SHA512-SUMS.txt
          Invoke-WebRequest "$base/$buildArchive" -OutFile build-godot.zip
          $expectedBuild = ((Select-String -Path SHA512-SUMS.txt -Pattern "\s$([regex]::Escape($buildArchive))$").Line -split '\s+')[0].ToLowerInvariant()
          $actualBuild = (Get-FileHash build-godot.zip -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($expectedBuild -ne $actualBuild) { throw 'Godot build editor SHA-512 mismatch' }
          Expand-Archive build-godot.zip -DestinationPath tools/build-godot
          if ($runtimeArchive -eq $buildArchive) {
            New-Item -ItemType Directory -Force tools/runtime-godot | Out-Null
            Copy-Item tools/build-godot/* tools/runtime-godot/ -Force
          } else {
            Invoke-WebRequest "$base/$runtimeArchive" -OutFile runtime-godot.zip
            $expectedRuntime = ((Select-String -Path SHA512-SUMS.txt -Pattern "\s$([regex]::Escape($runtimeArchive))$").Line -split '\s+')[0].ToLowerInvariant()
            $actualRuntime = (Get-FileHash runtime-godot.zip -Algorithm SHA512).Hash.ToLowerInvariant()
            if ($expectedRuntime -ne $actualRuntime) { throw 'Godot runtime SHA-512 mismatch' }
            Expand-Archive runtime-godot.zip -DestinationPath tools/runtime-godot
          }

      - name: Fetch pinned embedded starter artifacts
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File release/Fetch-OcpStarterArtifacts.ps1 `
            -ManifestPath release/starter-artifacts.json `
            -OutputDirectory release/out/starter-input

      - name: Build unsigned portable bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildGodot = Get-ChildItem tools/build-godot -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          $runtimeGodot = Get-ChildItem tools/runtime-godot -Filter '*.exe' |
            Where-Object { $_.Name -notmatch '_console\.exe$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($buildGodot)) { throw 'Godot x64 console build host was not found.' }
          if ([string]::IsNullOrWhiteSpace($runtimeGodot)) { throw 'Godot target GUI runtime executable was not found.' }
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File release/build_windows_portable.ps1 `
            -Version $env:RELEASE_VERSION `
            -Arch $env:TARGET_ARCH `
            -BuildGodotExe $buildGodot `
            -RuntimeGodotExe $runtimeGodot `
            -GodotExportTimeoutSeconds 180 `
            -StarterPackagePath release/out/starter-input/character.bible-1.0.0.ocp `
            -EffectStarterPackagePath release/out/starter-input/effect.starter-neon-1.0.0.ocp `
            -StoreOrigin $env:OCP_RELEASE_STORE_ORIGIN `
            -OutputDirectory release/out

      - name: Validate unsigned public build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Get-ChildItem release/out -Directory -Filter 'ocp-windows-*' | Select-Object -First 1
          if ($null -eq $bundle) { throw 'Portable bundle directory was not produced.' }
          $buildGodot = Get-ChildItem tools/build-godot -Filter '*.exe' | Select-Object -First 1 -ExpandProperty FullName
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File release/Test-OcpPublishableRelease.ps1 `
            -BundleDirectory $bundle.FullName `
            -Version $env:RELEASE_VERSION `
            -Arch $env:TARGET_ARCH `
            -GodotExe $buildGodot
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File release/Validate-OcpPortableBundle.ps1 `
            -BundleDirectory $bundle.FullName `
            -Version $env:RELEASE_VERSION `
            -Arch $env:TARGET_ARCH `
            -RequirePublishable

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ocp-public-unsigned-windows-${{ matrix.arch }}-${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
          path: |
            release/out/*.zip
            release/out/update-manifest.unsigned.json
          if-no-files-found: error
          retention-days: 7
