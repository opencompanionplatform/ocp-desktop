[package]
name = "ocp-character-package"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "I8B: the character-package entry schema (`character/1`). Parses and validates the data-only character content — sprites, §7 animation vocabulary, expression sets, a behavior RuleSet reference — inside a `type=character` .ocp, enforcing X3-E (no executable content ever rides a character package; only `plugin` packages carry WASM). The envelope (manifest/archive/signature, PACKAGE_CONTRACT v0.1) is `ocp-package-loader`; this crate is the character-specific interior it points `entry` at."

[dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# I8B-2 integration test: construct a real LoadedPackage and read its entry out
# of the archive, proving the character-interior pipeline against the loader's
# actual types. The envelope's own validation is package-loader's test surface.
ocp-package-loader = { path = "../package-loader" }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
# examples/pack_character.rs builds a real signed .ocp from the baked sprite.
ocp-package-builder = { path = "../package-builder" }
ed25519-dalek = "2"
