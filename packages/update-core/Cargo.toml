[package]
name = "ocp-release-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Signed application-update metadata, target selection, and staged artifact verification (ADR-0024, SEC-050)."

[dependencies]
base64 = "0.22"
chrono.workspace = true
ed25519-dalek = "2"
semver = "1"
serde = { workspace = true, features = ["derive"] }
serde_jcs = "0.2.0"
serde_json.workspace = true
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }

[[bin]]
name = "ocp-release-manifest"
path = "src/bin/ocp-update-manifest.rs"

[[bin]]
name = "ocp-release-check"
path = "src/bin/ocp-updater.rs"
