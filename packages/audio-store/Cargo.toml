[package]
name = "ocp-audio-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "I7 Voice: the kernel-owned temp audio store behind the `audioRef` shared type (EVENT_CATALOG.md, VOICE.md §3.1, Approved 2026-07-22). Audio bytes never ride the ≤1 MiB event envelope — producers (a `tts` router adapter, the mic capture path) put bytes and get an `audioRef`; consumers (the runtime, an `stt` adapter) resolve the ref exactly once. Single-consumer + expiring so audio never accumulates."

[dependencies]
uuid.workspace = true
serde.workspace = true
# Integrity of audio bytes across the transport boundary (audioRef.sha256).
# Pure-Rust, standard, no unsafe surfaces into this crate.
sha2 = "0.10"

[dev-dependencies]
# Real temp dirs for the file-backed (`with_dir`) mirror tests.
tempfile = "3"
