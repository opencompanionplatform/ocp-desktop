[package]
name = "ocp-companion-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OCP Companion Manager (ADR-0013, I6.5): owns N companion Actors (one mailbox + context each) over the platform's single-threaded event model — targeted (never broadcast) addressing, staggered scheduling, lifecycle mirroring, wake-on-request for sleeping companions. A routing/addressing layer, not a new concurrency primitive."

[dependencies]
ocp-shared-types = { path = "../shared-types" }
# Payload types + DEFAULT_COMPANION_ID for RUNTIME_API §8 events the manager
# emits/ingests. One-directional: runtime-api never knows the manager exists.
ocp-runtime-api = { path = "../runtime-api" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
ocp-runtime-stub = { path = "../runtime-stub" }
